name: Build debug APK

# 手动触发，或推送代码时自动触发
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # whisper.cpp 首次编译比较慢（要克隆 + 编译 C/C++），给足时间
    timeout-minutes: 60

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（AGP 8.x 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # whisper.cpp 需要 NDK 编译；版本号必须与 app/build.gradle.kts 的 ndkVersion 一致
      - name: 安装 Android NDK
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then SDKMAN="$(command -v sdkmanager)"; fi
          echo "使用 sdkmanager: $SDKMAN"
          yes | "$SDKMAN" --install "ndk;26.1.10909125" > /dev/null || true
          echo "已安装的 NDK："
          ls -1 "$ANDROID_HOME/ndk" || true

      # GitHub 的 ubuntu 运行器自带 Android SDK（ANDROID_HOME 已设置），无需额外安装
      # 本仓库刻意不带 gradle wrapper 的二进制 jar，所以这里直接安装指定版本的 Gradle
      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-interp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
