name: Build debug APK

# 手动触发，或推送代码时自动触发
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # 发 Release 需要写权限
    permissions:
      contents: write
    # whisper.cpp 首次编译比较慢（要克隆 + 编译 C/C++），给足时间
    timeout-minutes: 60

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（AGP 8.x 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 把 debug 签名文件缓存下来：否则每次构建都生成新的签名，
      # 手机上装新版本时必须先卸载旧版本。缓存后就能直接覆盖安装。
      - name: 缓存 debug keystore（固定签名）
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # whisper.cpp 需要 NDK 编译；版本号必须与 app/build.gradle.kts 的 ndkVersion 一致
      - name: 安装 Android NDK
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then SDKMAN="$(command -v sdkmanager)"; fi
          echo "使用 sdkmanager: $SDKMAN"
          yes | "$SDKMAN" --install "ndk;26.1.10909125" > /dev/null || true
          echo "已安装的 NDK："
          ls -1 "$ANDROID_HOME/ndk" || true

      # GitHub 的 ubuntu 运行器自带 Android SDK（ANDROID_HOME 已设置），无需额外安装
      # 本仓库刻意不带 gradle wrapper 的二进制 jar，所以这里直接安装指定版本的 Gradle
      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK（本次运行的产物）
        uses: actions/upload-artifact@v4
        with:
          name: offline-interp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ↓ 让"应用内更新"能工作：把 APK 发成一个 Release，App 通过 GitHub API 读最新版本
      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

      - name: 发布 Release（应用内更新读取这里）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: 自动构建的安装包；应用内的「检查更新」会读这个 Release。
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
