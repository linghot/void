name: Build debug APK

# 手动触发，或推送代码时自动触发
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（AGP 8.x 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu 运行器自带 Android SDK（ANDROID_HOME 已设置），无需额外安装
      # 本仓库刻意不带 gradle wrapper 的二进制 jar，所以这里直接安装指定版本的 Gradle
      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-interp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
